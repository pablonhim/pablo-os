<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pablo OS</title>

<!-- Home-screen behaviour lives here now, not in the Apps Script file, because
     this is the page you will actually pin. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pablo OS">
<meta name="theme-color" content="#FAFAFA">
<meta name="color-scheme" content="light dark">

<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #FAFAFA;
  }
  @media (prefers-color-scheme: dark) { html, body { background: #131313; } }
  iframe {
    display: block; border: 0;
    width: 100%; height: 100%;
  }
  /* shown only if the frame fails to load */
  #fallback {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; text-align: center;
    font: 15px/1.5 system-ui, sans-serif; color: #555; padding: 24px;
  }
</style>
</head>
<body>

<!--  ▼▼▼  PASTE YOUR /exec URL BETWEEN THE QUOTES BELOW  ▼▼▼  -->
<iframe id="app"
        src="PASTE_YOUR_EXEC_URL_HERE"
        allow="clipboard-write; fullscreen"
        referrerpolicy="no-referrer-when-downgrade"></iframe>

<div id="fallback">
  <div>
    Could not load the app.<br>
    Check that the URL in this file ends with <code>/exec</code>
    and that you are signed into the right Google account.
  </div>
</div>

<script>
  var f = document.getElementById('app');
  if (f.getAttribute('src').indexOf('script.google.com') === -1) {
    document.getElementById('fallback').style.display = 'flex';
  }
</script>

</body>
</html>
