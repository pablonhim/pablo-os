<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  /* Tablets and unfolded foldables get the desktop layout, shrunk to fit,
     never the narrow responsive one: the page is laid out 1280px wide and the
     browser scales it down to the screen. Phones (short side under 600px)
     keep the normal width for now. Desktop browsers ignore this tag. */
  (function () {
    var DESK = 1280, meta = document.querySelector('meta[name="viewport"]');
    function fit() {
      var a = screen.width, b = screen.height, short = Math.min(a, b), long = Math.max(a, b);
      var portrait = window.matchMedia ? matchMedia('(orientation: portrait)').matches : a < b;
      var across = portrait ? short : long;
      meta.setAttribute('content', short >= 600 && across < DESK
        ? 'width=' + DESK + ', viewport-fit=cover'
        : 'width=device-width, initial-scale=1, viewport-fit=cover');
    }
    fit();
    window.addEventListener('orientationchange', function () { setTimeout(fit, 60); });
    if (window.matchMedia) { var q = matchMedia('(orientation: portrait)'); (q.addEventListener ? q.addEventListener('change', fit) : q.addListener(fit)); }
  })();
</script>
<title>Pablo OS</title>

<!-- Home-screen behaviour lives here now, not in the Apps Script file, because
     this is the page you will actually pin. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pablo OS">
<meta name="theme-color" content="#FAFAFA">
<meta name="color-scheme" content="light dark">

<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #FAFAFA;
  }
  @media (prefers-color-scheme: dark) { html, body { background: #131313; } }
  iframe {
    display: block; border: 0;
    width: 100%; height: 100%;
  }
  /* shown only if the frame fails to load */
  #fallback {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; text-align: center;
    font: 15px/1.5 system-ui, sans-serif; color: #555; padding: 24px;
  }
</style>
</head>
<body>

<!--  ▼▼▼  PASTE YOUR /exec URL BETWEEN THE QUOTES BELOW  ▼▼▼  -->
<iframe id="app"
        src="https://script.google.com/macros/s/AKfycbwsMdziPYCqAVLYF6LFrjuO7Ywvrt6gF1vfN-x9Ty12zz8HyZJJgyMssJTmvcVIIjYj/exec"
        allow="clipboard-write; fullscreen"
        referrerpolicy="no-referrer-when-downgrade"></iframe>

<div id="fallback">
  <div>
    Could not load the app.<br>
    Check that the URL in this file ends with <code>/exec</code>
    and that you are signed into the right Google account.
  </div>
</div>

<script>
  var f = document.getElementById('app');
  if (f.getAttribute('src').indexOf('script.google.com') === -1) {
    document.getElementById('fallback').style.display = 'flex';
  }
  // the app names the tab ("Workspace: ..."); only the Apps Script frame may
  window.addEventListener('message', function (e) {
    var h = ''; try { h = new URL(e.origin).hostname; } catch (x) { return; }
    if (!/\.googleusercontent\.com$/.test(h)) return;
    var t = e.data && e.data.pabloTitle;
    if (typeof t === 'string' && t) document.title = t.slice(0, 80);
  });
</script>

</body>
</html>
